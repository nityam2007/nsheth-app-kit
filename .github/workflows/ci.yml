name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/app_test
      ALLOW_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace playground
      - run: npm run db:deploy --workspace playground
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run test:integration
      - name: Verify development HTTP and hydration contracts without a browser
        run: |
          npm run dev:bare > "$RUNNER_TEMP/development.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for (let i=0; i<30; i++) { try { const r=await fetch("http://localhost:3000/@vite/client"); if(r.ok) process.exit(0) } catch {} await new Promise(r=>setTimeout(r,1000)) } process.exit(1)'
          npm run test:http
          npm run test:auth
          npm run test:hydration
      - run: npm run build:cloudflare
