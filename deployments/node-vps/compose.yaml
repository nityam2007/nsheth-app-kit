services:
  app:
    build:
      context: ../..
      dockerfile: deployments/node-vps/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
